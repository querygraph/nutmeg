[workspace]
resolver = "2"
members = ["crates/nutmeg-graph", "crates/nutmeg-sail", "crates/nutmeg-server"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT OR Apache-2.0"
repository = "https://github.com/querygraph/nutmeg"
publish = false

[workspace.dependencies]
# The same DataFusion and Arrow pins as Sail 0.7 (DataFusion 55.1, Arrow 59)
# and as Grust's own DataFusion foundation, so one dependency graph serves
# the Sail server, the Grust kernels and this crate.
# No "sql" feature here: Sail builds DataFusion without it, and enabling it
# adds an error variant Sail's exhaustive matches do not cover. Only
# nutmeg-graph's tests use SQL, through that crate's `datafusion`
# dev-dependency, whose features resolver 2 unifies into a build only when
# nutmeg-graph's own test targets are built. So `cargo test -p nutmeg-graph`
# has it, and an invocation that builds nutmeg-graph's tests together with
# nutmeg-sail or nutmeg-server (`cargo test --workspace`, `cargo clippy
# --workspace --all-targets`) cannot compile Sail; the gate keeps them apart
# (README, "Building and testing").
datafusion = { version = "55.1.0", default-features = false, features = ["recursive_protection"] }
datafusion-common = { version = "55.1.0", default-features = false }
datafusion-expr = { version = "55.1.0", default-features = false }
arrow = "59"
arrow-array = "59"
arrow-schema = "59"
async-trait = "0.1"
futures = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
once_cell = "1"

# Grust: the kernels, their admission and the Arrow contract. Grust 0.23.0
# "Langoustine" is on crates.io, so these are registry dependencies: a clean
# clone of Nutmeg builds with no sibling `../grust` checkout.
grust-algorithms = { version = "0.23.0", features = ["arrow"] }
grust-algorithm-procedures = { version = "0.23.0", features = ["arrow"] }
grust-procedures = { version = "0.23.0" }
grust-core = { version = "0.23.0" }

# Sail: the data-source contract and the session factory. Sail does not
# publish to crates.io, so these are pinned to one upstream revision of
# `lakehq/sail` — the commit recorded in `SAIL_COMMIT`, which is on
# `lakehq/sail` main and carries the session-factory hook from #2630. A
# clean clone builds from that revision with no sibling `../sail` checkout.
sail-common = { git = "https://github.com/lakehq/sail.git", rev = "f1cf1729b1d083f2b97f1ce6e68a0d92c5ccee8f" }
sail-common-datafusion = { git = "https://github.com/lakehq/sail.git", rev = "f1cf1729b1d083f2b97f1ce6e68a0d92c5ccee8f" }
sail-telemetry = { git = "https://github.com/lakehq/sail.git", rev = "f1cf1729b1d083f2b97f1ce6e68a0d92c5ccee8f" }
sail-session = { git = "https://github.com/lakehq/sail.git", rev = "f1cf1729b1d083f2b97f1ce6e68a0d92c5ccee8f" }
sail-spark-connect = { git = "https://github.com/lakehq/sail.git", rev = "f1cf1729b1d083f2b97f1ce6e68a0d92c5ccee8f" }

[profile.release]
codegen-units = 16
