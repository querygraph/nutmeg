[workspace]
resolver = "2"
members = ["crates/nutmeg-graph", "crates/nutmeg-sail", "crates/nutmeg-server"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT OR Apache-2.0"
repository = "https://github.com/querygraph/nutmeg"
publish = false

[workspace.dependencies]
# The same DataFusion and Arrow pins as Sail 0.7 (DataFusion 55.1, Arrow 59)
# and as Grust's own DataFusion foundation, so one dependency graph serves
# the Sail server, the Grust kernels and this crate.
# No "sql" feature here: Sail builds DataFusion without it, and enabling it
# adds an error variant Sail's exhaustive matches do not cover. Only
# nutmeg-graph's own tests use SQL, through a dev-dependency feature, so run
# them with `cargo test -p nutmeg-graph`, not across the workspace.
datafusion = { version = "55.1.0", default-features = false, features = ["recursive_protection"] }
datafusion-common = { version = "55.1.0", default-features = false }
datafusion-expr = { version = "55.1.0", default-features = false }
arrow = "59"
arrow-array = "59"
arrow-schema = "59"
async-trait = "0.1"
futures = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
once_cell = "1"

# Grust: the kernels, their admission and the Arrow contract. Path
# dependencies on the sibling checkout while Nutmeg is developed against
# unreleased Grust; a published version replaces these at the first release.
grust-algorithms = { path = "../grust/crates/grust-algorithms", features = ["arrow"] }
grust-algorithm-procedures = { path = "../grust/crates/grust-algorithm-procedures" }
grust-procedures = { path = "../grust/crates/grust-procedures" }
grust-core = { path = "../grust/crates/grust-core" }

# Sail: the data-source contract and the session factory. Path dependencies
# on the sibling checkout, pinned by the commit recorded in README.md.
sail-common = { path = "../sail/crates/sail-common" }
sail-common-datafusion = { path = "../sail/crates/sail-common-datafusion" }
sail-telemetry = { path = "../sail/crates/sail-telemetry" }
sail-session = { path = "../sail/crates/sail-session" }
sail-spark-connect = { path = "../sail/crates/sail-spark-connect" }

[profile.release]
codegen-units = 16
