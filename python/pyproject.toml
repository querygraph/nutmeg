[project]
name = "nutmeg"
version = "0.1.0"
description = "Graph algorithms inside Sail from PySpark: stage a graph from DataFrames, run Grust's algorithms, get DataFrames back"
requires-python = ">=3.9"
license = "MIT OR Apache-2.0"
dependencies = []

[project.optional-dependencies]
spark = ["pyspark[connect]>=3.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
