[package]
name = "nutmeg-server"
description = "The Sail Spark Connect server with the nutmeg data source and table functions registered"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "nutmeg-server"
path = "src/main.rs"

[dependencies]
nutmeg-sail = { path = "../nutmeg-sail" }
sail-common = { workspace = true }
sail-session = { workspace = true }
sail-telemetry = { workspace = true }
sail-spark-connect = { workspace = true }
tokio = { workspace = true, features = ["net", "signal"] }
# Sail embeds Python for UDFs and data source discovery; the interpreter must
# be initialized by the host binary, as sail-cli does.
pyo3 = "0.29.0"
