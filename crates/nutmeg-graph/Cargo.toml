[package]
name = "nutmeg-graph"
description = "Grust graph kernels as DataFusion table functions over named projections"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
datafusion = { workspace = true }
datafusion-common = { workspace = true }
datafusion-expr = { workspace = true }
arrow = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
once_cell = { workspace = true }
grust-algorithms = { workspace = true }
grust-algorithm-procedures = { workspace = true }
grust-procedures = { workspace = true }
grust-core = { workspace = true }

[features]
# The SQL surface, for tests that go through `ctx.sql`. Off by default because
# DataFusion's `sql` feature adds an error variant that Sail's exhaustive match
# over `DataFusionError` does not cover, so a build that enables it cannot also
# build `nutmeg-sail`. Nutmeg's own SQL table functions do not need it.
sql = ["datafusion/sql"]

[dev-dependencies]
tokio = { workspace = true }
