[package]
name = "nutmeg-graph"
description = "Grust graph kernels as DataFusion table functions over named projections"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
datafusion = { workspace = true }
datafusion-common = { workspace = true }
datafusion-expr = { workspace = true }
arrow = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
once_cell = { workspace = true }
grust-algorithms = { workspace = true }
grust-algorithm-procedures = { workspace = true }
grust-procedures = { workspace = true }
grust-core = { workspace = true }
# The bounded channel a streaming read's kernel thread feeds.
tokio = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
# The tests that go through `ctx.sql` need DataFusion's SQL parser. It is a
# feature on this dev-dependency, not a crate feature, so `cargo test -p
# nutmeg-graph` has it and no dependent of nutmeg-graph does: under Cargo's
# resolver 2 a dev-dependency's features are unified into a build only when
# this package's own test, example or bench targets are being built.
# DataFusion's `sql` feature turns on `datafusion-common/sql`, which adds a
# `DataFusionError::SQL` variant that Sail's exhaustive match does not cover,
# so a build of `nutmeg-sail` or `nutmeg-server` must never see it. That is
# why the gate runs clippy over `nutmeg-graph --all-targets` in one
# invocation and over `nutmeg-sail`/`nutmeg-server` in another (README,
# "Building and testing").
datafusion = { workspace = true, features = ["sql"] }
